gradle.beforeProject { project ->
    project.plugins.withId('com.android.application') {
        if(project.path==':validation-app') {
            project.android.sourceSets.getByName('androidTest').java.srcDir('src/researchAndroidTest/kotlin')
            project.android.sourceSets.getByName('androidTest').assets.srcDir(new File(project.rootDir,'test-artifacts/exercise-knowledge/live-stage-profile-20261028/assets'))
        }
    }
}
