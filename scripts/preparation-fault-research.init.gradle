gradle.projectsEvaluated {
    def motion=gradle.rootProject.project(':core-motion')
    def root=gradle.rootProject.projectDir
    [qualifiedRepBenchmark:'mechanism.json',qualifiedRepPathBenchmark:'path.json',
     qualifiedRepDepartureBenchmark:'departure.json',qualifiedRepEvidenceBenchmark:'evidence.json'].each { name,fileName ->
        motion.tasks.named(name,JavaExec).configure {
            def output=new File(root,'test-artifacts/exercise-knowledge/preparation-fault-controls/'+fileName)
            setArgs([output.absolutePath])
            doFirst { if(output.exists()) throw new GradleException('Preserve frozen control receipt');output.parentFile.mkdirs() }
        }
    }
    motion.tasks.register('preparationFaultDevelopmentReplay',JavaExec) {
        dependsOn(motion.tasks.named('testClasses'))
        classpath=motion.sourceSets.test.runtimeClasspath
        mainClass='ai.senp.motion.UiprmdDevelopmentReplay'
        def output=new File(root,'test-artifacts/exercise-knowledge/uiprmd/preparation-fault-development-replay.json')
        doFirst { if(output.exists()) throw new GradleException('Preserve candidate development replay') }
        args(new File(root,'test-artifacts/exercise-knowledge/uiprmd/development-vicon').absolutePath,output.absolutePath)
        maxHeapSize='1200m'
    }
}
