gradle.projectsEvaluated {
    def core = gradle.rootProject.project(':core-motion')
    core.tasks.register('liteReferenceScreen', JavaExec) {
        dependsOn(core.tasks.named('testClasses'))
        classpath = core.sourceSets.test.runtimeClasspath
        mainClass = 'ai.senp.motion.LiteReferenceCalibrationAudit'
        args(gradle.rootProject.projectDir.absolutePath)
        maxHeapSize = '1500m'
    }
}
