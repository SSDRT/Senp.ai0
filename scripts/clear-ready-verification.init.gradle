gradle.projectsEvaluated {
    def motion = gradle.rootProject.project(':core-motion')
    def root = gradle.rootProject.projectDir
    [qualifiedRepBenchmark:'mechanism.json',qualifiedRepPathBenchmark:'path.json',
     qualifiedRepDepartureBenchmark:'departure.json',qualifiedRepEvidenceBenchmark:'evidence.json'].each { taskName,name ->
        motion.tasks.named(taskName,JavaExec).configure {
            def output = new File(root,'test-artifacts/exercise-knowledge/clear-ready-controls/'+name)
            setArgs([output.absolutePath])
            doFirst { if(output.exists()) throw new GradleException('Preserve control receipt');output.parentFile.mkdirs() }
        }
    }
    motion.tasks.register('clearReadyValidationReplay',JavaExec) {
        dependsOn(motion.tasks.named('testClasses'));classpath=motion.sourceSets.test.runtimeClasspath
        mainClass.set('ai.senp.motion.UiprmdReadyFormValidationReplay')
        def output=new File(root,'test-artifacts/exercise-knowledge/uiprmd/clear-ready-validation-replay.json')
        args(new File(root,'test-artifacts/exercise-knowledge/uiprmd/validation-vicon').absolutePath,output.absolutePath,
            new File(root,'test-artifacts/exercise-knowledge/uiprmd/development-vicon').absolutePath,
            new File(root,'models/clear-ready-research-protocol.json').absolutePath)
        maxHeapSize='1500m'
        doFirst {
            def dev=new groovy.json.JsonSlurper().parse(new File(root,'test-artifacts/exercise-knowledge/clear-ready-development-comparison.json'))
            if(!dev.promotion_gate_passed || output.exists()) throw new GradleException('Development must pass; preserve validation receipt')
        }
    }
    motion.tasks.register('clearReadyCameraReferenceAudit',JavaExec) {
        dependsOn(motion.tasks.named('testClasses'));classpath=motion.sourceSets.test.runtimeClasspath
        mainClass.set('ai.senp.motion.ClearReadyCameraReferenceAudit');args(root.absolutePath);maxHeapSize='1500m'
    }
}
