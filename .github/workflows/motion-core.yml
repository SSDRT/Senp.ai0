name: Motion Core

on:
  pull_request:
    paths:
      - "core-motion/**"
      - "docs/MOTION_CORE.md"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/motion-core.yml"
  push:
    branches: [main]
    paths:
      - "core-motion/**"
      - "docs/MOTION_CORE.md"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/motion-core.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify deterministic motion core
        run: ./gradlew --no-daemon :core-motion:verifyMotionCore
